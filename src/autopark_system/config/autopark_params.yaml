autopark_master:
  ros__parameters:
    planner_mode: "right_only"

    # Topics
    start_switch_topic:      "/autopark/start_switch"
    cam_check_request_topic: "/autopark/cam_check_request"
    pose_topic:              "/autopark/start_pose"
    parking_metrics_topic:   "/parking_metrics"
    ultrasonic_topic:        "/autopark/ultrasonic"
    command_topic:           "/autopark/cmd_json"
    plan_topic:              "/autopark/plan_result"
    slot_topic:              "/autopark/slot_info"
    flow_distance_topic:     "/autopark/flow_distance"
    imu_topic:               "/imu/data_raw"
    esp32_steer_ready_topic: "/autopark/esp32_steer_ready"

    # Start pose — car must be ≥1.28m before slot entrance (in aisle)
    use_default_pose_when_missing: false
    default_start_x:       -1.28    # must be ≤ -R=-1.335m (measured arc radius)
    default_start_y:        0.70
    default_start_yaw_deg: 180.0

    # Camera check
    camera_check_enabled:    true   # false = always yellow, bypass camera
    camera_pose_max_age_s:   3.0
    cam_check_request_topic: "/autopark/cam_check_request"

    # Steer / speed
    speed_scale:           0.03     # slippery floor: low speed = less wheel spin
    max_command_steer_deg: 30.0

    # Steer settle
    steer_ready_timeout_s:  10.0    # arc settle may take longer at higher PWM
    steer_settle_pause_s:   1.5     # longer: steer needs time to reach -30° against spring
    steer_wait_fallback_s:  6.0
    pause_between_commands: 5.0     # longer pause to fully stop before next move
    # Time from drive command sent to motor physically spinning.
    # Fallback when optical flow is not available.
    # Tune: (d_expected - d_actual) / speed = (1.98 - 1.43) / 0.481 = 1.14s → use 1.2
    motor_start_delay_s:    1.2
    # Arc time budget when IMU is not available.
    # User confirmed: arc takes ~10s to complete 90°.
    # Set slightly above 10s so time_stop fires after full arc.
    # Tune: if car overshoots → lower; if undershoots → raise.
    arc_fallback_time_s:    12.0

    # Calibrated speeds (time fallback)
    forward_turn_speed_mps:       0.055
    reverse_turn_speed_mps:       0.501    # measured from arc test
    forward_straight_speed_mps:   0.481    # measured: ~340cm / 99s = 0.034 m/s
    reverse_straight_speed_mps:   0.501    # estimate — calibrate after arc is fixed
    straight_steer_threshold_deg: 3.0

    # Timing ← FIXED
    max_segment_dist_m: 2.5
    min_chunk_dist_m:   0.10
    drive_time_min_s:   1.0
    drive_time_max_s:   120.0    # ← was 60, MUST be ≥104s for arc to complete

    # IMU arc stop (arc move)
    imu_arc_stop_enabled:         true
    imu_arc_min_steer_deg:        8.0
    imu_arc_stop_factor:          0.83
    imu_arc_wait_before_check_s:  0.3

    # Flow stop (disabled)
    flow_straight_stop_enabled:         true
    flow_straight_stop_factor:          0.90
    flow_straight_wait_before_check_s:  0.3

    # Rear US stop — d4 move PRIMARY stop
    # Sensor 6 (index 5) stops at 40mm
    # Sensors 7,8 (indices 6,7) are emergency at 25mm
    rear_ultrasonic_stop_m:  0.200
    rear_us_indices: [6]               # ← 6 = ultrasonic x7
    d4_speed_mps:            0.003

    # All-sensor emergency stop
    drive_ultrasonic_safety: false
    ultrasonic_stop_m:       0.050

    # Stuck detection
    enable_stuck_detection:   true
    stuck_check_after_s:      3.0
    stuck_gyro_min_rads:      0.006
    stuck_flow_delta_min_m:   0.005
    stuck_kick_speed_mps:     0.10
    stuck_kick_duration_s:    0.5
    stuck_retry_pause_s:      0.2
    stuck_max_retries:        1

    flow_valid_required:        false
    send_arm_command_on_start:  false
    disable_ultrasonic_block:   true
    min_clearance_m:            0.12
    us_safety_start_delay_s:    0.50

serial_bridge:
  ros__parameters:
    drive_port:              "/dev/ttyUSB0"
    us_all_port:             "/dev/ttyUSB1"
    us_front_port:           ""
    us_rear_port:            ""
    baud:                    115200
    debug_serial:            false
    start_switch_topic:      "/autopark/start_switch"
    esp32_steer_ready_topic: "/autopark/esp32_steer_ready"
    esp32_status_topic:      "/autopark/esp32_status"
    cam_check_request_topic: "/autopark/cam_check_request"


perception_bridge:
  ros__parameters:
    publish_start_pose:     true
    use_camera_pose:        true
    default_start_x:        -1.28
    default_start_y:         0.70
    default_start_yaw_deg:  180.0
    case_detection_mode:    "fixed"
    fixed_case:             "right_only"
    camera_metrics_timeout_s:  5.0    # ← NEW: pose only published when detection fresh
    camera_x_scale:   0.01    # was -0.01 (sign was also wrong for pose.x)
    camera_y_scale:   0.01
    camera_x_offset_m: 0.0
    camera_y_offset_m: 0.0

motion_executor:
  ros__parameters:
    plan_topic: "/autopark/plan_result_disabled"   # DISABLED — autopark_master executes directly

vins_pose_bridge:
  ros__parameters:
    odom_topic:       "/vins_estimator/odometry"
    start_pose_topic: "/autopark/start_pose"
    x_offset:          0.0
    y_offset:          0.0
    yaw_offset_deg:    0.0   # tune if VINS world frame doesn't match planner frame
    publish_rate_hz:   10.0
