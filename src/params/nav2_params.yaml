planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    # เลือกใช้ Smac Planner สำหรับรถที่เป็นแบบรถยนต์ (Ackermann/Dubin)
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: "DUBIN" # เหมาะกับรถเดินหน้าอย่างเดียวแบบ Go-kart
      angle_quantization_n: 72
      minimum_turning_radius: 0.1 # รัศมีวงเลี้ยวแคบสุดของรถคุณ (เมตร)
      reverse_weight: 2.0
      unit_cost: 1.0
      cost_travel_multiplier: 2.0

global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: True  # <--- เพิ่มบรรทัดนี้ลงไปครับ! (สำคัญมาก)
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.1 # ขนาดตัวรถของคุณ (เมตร)
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: False
        map_topic: "/local_map"  # <--- เพิ่มบรรทัดนี้! เพื่อสั่งให้อ่านแผนที่จากกล้อง
        enabled: True
        subscribe_to_updates: True
        transform_tolerance: 0.1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.1 # ระยะปลอดภัยจากกำแพง
