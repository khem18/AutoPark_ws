autopark_master:
  ros__parameters:
    planner_mode: "left_only"
    slot_topic: "/autopark/slot_info"

    start_switch_topic: "/autopark/start_switch"
    pose_topic: "/autopark/start_pose"
    parking_metrics_topic: "/parking_metrics"
    ultrasonic_topic: "/autopark/ultrasonic"
    command_topic: "/autopark/cmd_json"
    plan_topic: "/autopark/plan_result"
    flow_distance_topic: "/autopark/flow_distance"
    imu_topic: "/imu/data_raw"

    use_default_pose_when_missing: true
    default_start_x: 0.00
    default_start_y: 0.70
    default_start_yaw_deg: 180.0

    # Real mode: fallback path is for bench tests only.
    # If planner fails, autopark_master stops with planner_failed_no_motion.
    allow_fallback_path: false

    # Tight slot: do not block before start using 12 cm logic.
    disable_ultrasonic_block: true
    min_clearance_m: 0.12

    # Main command speed cap sent to ESP32.
    speed_scale: 0.10

    # Steer first, then drive. ESP32 steerReady also gates drive motor.
    steer_wait_seconds: 10.0
    pause_between_commands: 1.0

    # Calibrated speeds used for: drive_time = planner_dist_m / speed.
    forward_turn_speed_mps: 0.055
    reverse_turn_speed_mps: 0.076
    forward_straight_speed_mps: 0.0675
    reverse_straight_speed_mps: 0.0775
    straight_steer_threshold_deg: 3.0

    drive_time_min_s: 2.0
    drive_time_max_s: 60.0

    # Ultrasonic is emergency stop only while driving.
    drive_ultrasonic_safety: true
    ultrasonic_stop_m: 0.025

    # Optical flow is logging/monitoring only in this version.
    flow_valid_required: false

    # Usually false because physical start switch already arms ESP32.
    send_arm_command_on_start: false

perception_bridge:
  ros__parameters:
    parking_metrics_topic: "/parking_metrics"
    imu_topic: "/imu/data_raw"
    start_pose_topic: "/autopark/start_pose"
    slot_topic: "/autopark/slot_info"
    publish_start_pose: true
    use_camera_pose: false
    default_start_x: 0.00
    default_start_y: 0.70
    default_start_yaw_deg: 180.0
    case_detection_mode: "fixed"
    fixed_case: "left_only"
    camera_x_scale: -0.01
    camera_y_scale: 0.01
    camera_x_offset_m: 0.0
    camera_y_offset_m: 0.0
    yaw_from_camera_tilt: false

serial_bridge:
  ros__parameters:
    drive_port: "/dev/ttyUSB2"
    us_front_port: ""
    us_rear_port: ""
    us_all_port: "/dev/ttyUSB1"
    baud: 115200
    debug_serial: false

motion_executor:
  ros__parameters:
    # Disabled because autopark_master executes timed motions directly.
    plan_topic: "/autopark/plan_result_disabled"
    command_topic: "/autopark/cmd_json"
    open_loop_speed_mps: 0.12
    segment_pause_s: 0.20

lot_detector:
  ros__parameters:
    show_debug_windows: false

flow_distance_node:
  ros__parameters:
    image_topic: "/rear_cam/image_raw"
    imu_topic: "/imu/data_raw"
    output_topic: "/autopark/flow_distance"
    scale_m_per_px: 0.0105
    deadband_px_per_frame: 0.0001
    crop_ratio: 0.60
    min_texture_std: 5.0
    max_v_mps: 1.0
