# ── autopark_params.yaml  (merged: old working config + perception_bridge fix) ──
# Differences from the broken config (from zip):
#  1. planner_mode: "right_only"  (zip had "both_sides" → planner found no valid plan)
#  2. perception_bridge.use_camera_pose: true  (zip missing section → defaulted false → fixed pose)
#  3. perception_bridge.camera_metrics_timeout_s: 5.0  (my fix used 1.0, old used 5.0 → safer)
#  4. perception_bridge.fixed_case: "right_only"  (my fix was missing this)
#  5. serial_bridge.enc_handles_straight: true  (my fix was missing this)
#  6. speed_scale: 0.01 → matches actual hardware (zip had 0.12)
#  7. Restored vins_pose_bridge + rear_cam_tracker sections

autopark_master:
  ros__parameters:
    planner_mode: "right_only"   # ← FIX: was "both_sides" in zip → planner returned 0 motions

    # Topics
    start_switch_topic:      "/autopark/start_switch"
    cam_check_request_topic: "/autopark/cam_check_request"
    pose_topic:              "/autopark/start_pose"
    parking_metrics_topic:   "/parking_metrics"
    ultrasonic_topic:        "/autopark/ultrasonic"
    command_topic:           "/autopark/cmd_json"
    plan_topic:              "/autopark/plan_result"
    slot_topic:              "/autopark/slot_info"
    flow_distance_topic:     "/autopark/flow_distance"
    imu_topic:               "/imu/data_raw"
    esp32_steer_ready_topic: "/autopark/esp32_steer_ready"
    rear_cam_topic:          "/rear_parking_metrics"

    # Start pose
    use_default_pose_when_missing: false
    default_start_x:       -1.28
    default_start_y:        0.70
    default_start_yaw_deg: 180.0

    # Camera check
    camera_check_enabled:    true
    camera_pose_max_age_s:   3.0

    # Steer / speed
    # ── Speed & wheel compensation ────────────────────────────────
    speed_scale:           0.03     # ← 0.03 m/s (was 0.01); arc move uses this directly
    max_command_steer_deg: 30.0

    # Left-wheel slower compensation.
    # This car: left motor physically slower → right motor faster → car veers RIGHT.
    # PRIMARY FIX: increase left_pwm_boost in esp32_drive_controller.ino.
    # SOFTWARE WORKAROUND (use while tuning firmware):
    #   NEGATIVE value steers LEFT during forward → counteracts rightward drift.
    #   gear=+1 straight: steer += bias   (negative → steer left → fight right drift)
    #   gear=-1 straight: steer += -bias  (positive → steer right → fight left rev drift)
    # Tune: start at -2.0, test straight drive, adjust in 0.5° steps.
    # Set to 0.0 once left_pwm_boost is dialled in and car goes straight.
    steer_straight_bias_deg: -3.0   # ← START HERE; tune toward 0 as firmware improves
    steer_bias_apply_thresh_deg: 2.0

    # ── IMU arc stopping (Move 2) ─────────────────────────────────
    imu_topic:                   "/imu/data_raw"
    imu_arc_stop_enabled:        true
    imu_arc_stop_factor:         0.89    # stop at 51% of arc yaw change
    imu_arc_stop_factor_stuck:   0.86   # smaller factor when arc is boosted (passenger load)
    arc_stuck_speed_threshold_mps: 0.06 # session_arc speed above which stuck-factor applies
    imu_arc_wait_before_check_s: 1.00   # FIX was 0.30 — car needs ~1s to start rotating
    imu_arc_reversal_enabled:    true   # stop early if arc angle drops from peak
    imu_arc_reversal_min_deg:    10.0
    imu_arc_reversal_drop_deg:    3.0
    imu_arc_stop_timeout_s:      120.0
    # FIX: 0.0 = auto-calculate (s23*factor/speed*1.2 ≈ 24 s for this setup)
    arc_fallback_time_s:         0.0
    # FIX: stop arc via encoder distance when IMU gyro = 0
    imu_arc_enc_backup_enabled:  true

    # ── Encoder result & status topics ───────────────────────────
    enc_result_topic:    "/enc_result"
    enc_status_topic:    "/enc_status"
    enc_result_timeout_s: 130.0

    # Steer settle
    steer_ready_timeout_s:  10.0
    steer_settle_pause_s:   0.5
    steer_wait_fallback_s:  6.0
    pause_between_commands: 5.0
    motor_start_delay_s:    1.8
    arc_fallback_time_s:    0.0    # FIX was 12.0 — auto-calculate from s23/speed/factor

    # Calibrated speeds
    forward_turn_speed_mps:       0.225
    reverse_turn_speed_mps:       0.236
    forward_straight_speed_mps:   0.060
    reverse_straight_speed_mps:   0.040
    straight_steer_threshold_deg: 3.0

    # Timing
    max_segment_dist_m: 2.5
    min_chunk_dist_m:   0.10
    drive_time_min_s:   1.0
    drive_time_max_s:   120.0

    # IMU arc stop
    imu_arc_stop_enabled:         true
    imu_arc_min_steer_deg:        8.0
    imu_arc_stop_factor:          0.89
    imu_arc_stop_factor_stuck:    0.86
    arc_stuck_speed_threshold_mps: 0.06
    imu_arc_wait_before_check_s:  1.0   # FIX was 0.3
    imu_arc_reversal_enabled:     true
    imu_arc_reversal_min_deg:     10.0
    imu_arc_reversal_drop_deg:     3.0
    arc_fallback_time_s:          0.0   # FIX: auto-calculate correct stop time
    imu_arc_enc_backup_enabled:   true  # FIX: encoder stop when IMU = 0
    imu_arc_reversal_enabled:    true
    imu_arc_reversal_min_deg:    10.0
    imu_arc_reversal_drop_deg:    3.0
    imu_arc_stop_factor_stuck:      0.48
    arc_stuck_speed_threshold_mps:  0.06

    # IMU straight heading correction
    imu_straight_correct_enabled:    true
    imu_straight_correct_thresh_deg: 2.0
    imu_straight_correct_gain:       1.5
    imu_straight_correct_max_deg:    8.0

    # Flow stop (disabled)
    flow_straight_stop_enabled:         false
    flow_straight_stop_factor:          0.90
    flow_straight_wait_before_check_s:  0.3

    # Rear US stop
    rear_ultrasonic_stop_m:  0.200
    rear_us_indices: [6]
    d4_speed_mps:            0.003

    # All-sensor emergency stop
    drive_ultrasonic_safety: false
    ultrasonic_stop_m:       0.050

    # Stuck detection
    enable_stuck_detection:   true
    stuck_check_after_s:      15.0
    stuck_gyro_min_rads:      0.006
    stuck_flow_delta_min_m:   0.005
    stuck_kick_speed_mps:     0.10
    stuck_kick_duration_s:    0.5
    stuck_retry_pause_s:      0.2
    stuck_max_retries:        1

    # Steer stuck kick
    steer_stuck_kick_enabled:           true
    steer_stuck_kick_overshoot:         2.5
    steer_stuck_kick_limit_deg:         75.0
    steer_stuck_kick_hold_s:            1.0
    steer_stuck_kick_retries:           3
    steer_stuck_kick_drive_speed_mps:   0.08
    steer_stuck_kick_timeout_s:         3.0

    flow_valid_required:        false
    send_arm_command_on_start:  false
    disable_ultrasonic_block:   true
    min_clearance_m:            0.12
    us_safety_start_delay_s:    0.50

    # ── Forward clearance guard ────────────────────────────────────────
    # FIX (per request — disabled entirely): this yaml override never got
    # synced when the Python defaults were updated from x1/x2/x3 to x4/x5,
    # so the guard kept firing on unreliable front sensors regardless of
    # what the Python file said — since yaml wins at launch. Disabled
    # outright rather than keep chasing index-sync issues between files.
    # Move 1 will no longer be skipped due to any ultrasonic reading.
    us_fwd_guard_enable:         false   # disabled — was true
    us_fwd_indices:              [3, 4]  # unused while disabled (synced for consistency)
    us_fwd_min_m:                0.15    # unused while disabled

    # ── Ultrasonic centering mode ──────────────────────────────────────
    # us_center_enable: master on/off for ALL post-park US correction
    # us_kinetic_enable: true  → kinetic (continuous-motion) centering
    #                   false → legacy discrete stop-measure-correct loop
    us_center_enable:            true
    us_kinetic_enable:           true

    # Kinetic Phase-A (forward creep with live steer for lateral centering):
    # Slot lateral range: 19–31 cm side clearance → centre 25 cm, deadband 6 cm.
    us_kinetic_fwd_max_m:        0.15    # max 15 cm forward travel for lateral
    # Kinetic Phase-B (depth seek — reverse if too far, forward if too close):
    # Worst case: rear = 44.5 cm, target hi = 26 cm → need 18.5 cm reverse.
    # Add 30% margin → 0.30 m reverse budget. Forward budget covers overshoot.
    us_kinetic_rev_max_m:        0.35    # max 35 cm reverse travel  (was 0.25)
    # Control rate for streaming steer/speed updates (Hz):
    us_kinetic_update_hz:        10.0    # 100 ms per update tick
    # Pause after each phase:
    us_kinetic_settle_s:         0.40
    # FIX: re-arm ESP32 before kinetic. encoder_bridge's DriveSerial sends
    # stop() at the end of Move 3 via its own fd on the drive port — the
    # ESP32 firmware requires {"type":"arm"} before accepting new drive
    # commands after a stop, otherwise ALL kinetic commands are ignored
    # and the motor doesn't react at all.
    kinetic_rearm_wait_s:        0.5
    # FIX: emergency abort during kinetic — independent of the rear-target
    # window. Checked against all 8 sensors every loop tick; catches
    # overshoot from sensor-update lag or motor coast during the gear-
    # switch settle pause. The car was observed parked at 2.7cm from the
    # rear wall (target window is 14-26cm) before this was added.
    us_kinetic_min_safe_m:       0.05    # 5cm hard floor — emergency stop (always active)
    # FIX (per request): the standalone "ultrasonic data older than 0.3s"
    # abort is no longer used by the drive logic — the continuous-drive +
    # 1s recalculation cadence below (tied to confirmed encoder movement)
    # replaces it. Left declared so old overrides don't error out.
    us_kinetic_max_data_age_s:   0.30    # (no longer read by drive logic)

    # FIX: continuous driving with periodic recalculation — the car keeps
    # moving; every us_kinetic_recalc_period_s, gated on CONFIRMED encoder
    # movement (not just elapsed time), a fresh ultrasonic reading is taken
    # and the steer/gear correction is recomputed, refreshing the drive
    # command. Repeats until within tolerance.
    us_kinetic_recalc_period_s:  1.0     # drive duration once movement confirmed (Phase A)
    # Phase B (depth) recalculates faster — tighter cycle for the more
    # safety-sensitive forward/reverse axis. Confirmed correct as a Python
    # default but adding explicitly here too after the forward-guard
    # index mismatch taught us not to leave things implicit between files.
    us_kinetic_recalc_period_b_s: 0.5
    us_kinetic_min_enc_move_m:   0.01    # 1cm — confirms real movement happened
    # FIX (per request): if the ultrasonic reading shows zero change for
    # this many consecutive forward cycles (despite the encoder confirming
    # the wheels turned each time), the car has run out of forward room —
    # triggers a brief reverse instead of continuing to push forward.
    # FIX (per request): EITHER side reading zero change now triggers this
    # (was requiring BOTH), and fires immediately on the first occurrence
    # (was waiting for 2 in a row). A one-sided block (only ΔL or only ΔR
    # staying at zero) means that corner is already out of room — pushing
    # forward further moves the car out of the slot, not toward centering.
    us_kinetic_unchanged_limit:  1   # was 2
    # FIX (per request): if still blocked after one reverse, keep
    # reversing immediately rather than cycling back through a forward
    # attempt first. Caps consecutive reverses in a single unstick burst.
    us_kinetic_unstick_max_retries: 3
    # FIX (per request): full stop after every confirmed 1s drive interval,
    # before checking the next fresh ultrasonic reading. Max wait for the
    # encoder to confirm movement actually began before treating as stuck:
    us_kinetic_move_start_timeout_s: 2.0

    # SUPERSEDED by the continuous-drive architecture above — these
    # fraction-based discrete-step params are no longer read by the drive
    # logic, left declared only so old overrides don't error out.
    us_kinetic_step_fraction:    0.25
    us_kinetic_min_step_m:       0.02
    us_kinetic_max_step_lat_m:   0.06
    us_kinetic_max_step_depth_m: 0.10
    # FIX (per request): Phase A's forward-budget early exit was removed —
    # it was stopping the loop at "budget exhausted" with err still at
    # -26cm remaining, well before tolerance, after using only half the
    # available attempts. Now only the safety floor or running out of
    # attempts can end Phase A unsuccessfully. Raised from 10 to 20 so it
    # has enough cycles to actually converge.
    us_kinetic_max_attempts:     20      # was 10
    # FIX (per request): re-run lateral centering if depth correction drags
    # it back out of tolerance, instead of just detecting and reporting the
    # failure. Caps how many A→B outer passes to try.
    us_kinetic_outer_attempts:   3

    # Shared US params (used by both kinetic and legacy modes)
    # FIX: was us_left_idx=1 (x2), us_right_idx=2 (x3) — both FRONT sensors,
    # reading 150-260cm (open space) in every log → lateral centering's
    # OOB-skip guard fired on nearly every run, so it never corrected.
    # Confirmed hardware layout: x4=left (idx 3), x5=right (idx 4).
    us_left_idx:                 3       # x4 = left  (was 1 → x2, front sensor)
    us_right_idx:                4       # x5 = right (was 2 → x3, front sensor)
    us_rear_idx:                 6
    # x4=left/x5=right now confirmed, so default sign (+1.0) should be
    # correct. Flip to -1.0 only if the car steers toward the closer wall
    # instead of away from it after this fix.
    lateral_correction_sign:     1.0
    # Lateral deadband: slot side clearance is 19–31 cm (range 12 cm).
    # Centre = 25 cm each side → accept ±6 cm from centre → deadband 6 cm.
    us_deadband_m:               0.010   # 1 cm lateral deadband (corrected)
    us_steer_gain:               150.0   # error_m * gain = steer_deg
    us_max_steer_deg:            15.0
    # FIX: kinetic operates in a confirmed-narrow slot — the old shared
    # gain/cap above committed to the full max steer for any error >=10cm,
    # regardless of actual measured side clearance. Kinetic now uses its
    # own gentler gain plus a clearance-aware cap that scales the allowed
    # steer angle down as the tighter side's clearance shrinks below
    # us_kinetic_clearance_ref_m — large turns only happen when there's
    # actually room for them.
    # FIX (per request): was producing only 4-7° actual steer across an
    # entire 20-cycle run that never converged. Raised so typical errors
    # in the 15-23cm clearance range this car usually operates in produce
    # a more assertive correction before the clearance cap applies.
    us_kinetic_steer_gain:       90.0   # was 60.0
    us_kinetic_max_steer_deg:    10.0
    us_kinetic_clearance_ref_m:  0.30
    us_correction_speed_mps:     0.06    # speed during kinetic + legacy moves
    us_correction_dist_m:        0.12    # legacy mode: fixed step distance
    us_max_attempts:             3       # legacy mode only
    us_rear_target_m:            0.20    # target 20 cm from rear wall
    us_rear_tolerance_m:         0.05    # accept 15–25 cm  (± 5 cm, corrected)
    us_depth_max_step_m:         0.04    # legacy depth: max one-step correction
    us_depth_max_attempts:       4       # legacy depth only
    us_stop_buffer_s:            0.20
    us_stop_settle_s:            0.60
    us_steer_wait_s:             2.0     # time to pre-steer before moving

    # Rear-camera Move3 correction
    rear_cam_enabled:          false
    rear_cam_stop_m:           0.375
    rear_cam_stable_samples:   5
    rear_cam_timeout_s:        15.0

serial_bridge:
  ros__parameters:
    # FIX: synced to the currently-confirmed port mapping — this had drifted
    # to stale values (ttyUSB2/ttyUSB0) that didn't match what's actually
    # verified working (drive=ttyUSB0, ultrasonic=ttyUSB1, per your own
    # startup logs). Matches encoder_bridge's launch-file ports too.
    drive_port:              "/dev/ttyUSB0"
    enc_handles_straight:    true    # ← was missing from zip config
    enc_straight_thresh_deg: 5.0
    us_all_port:             "/dev/ttyUSB1"
    us_front_port:           ""
    us_rear_port:            ""
    baud:                    115200
    debug_serial:            false
    start_switch_topic:      "/autopark/start_switch"
    esp32_steer_ready_topic: "/autopark/esp32_steer_ready"
    esp32_status_topic:      "/autopark/esp32_status"
    cam_check_request_topic: "/autopark/cam_check_request"

perception_bridge:
  ros__parameters:
    publish_start_pose:       true
    use_camera_pose:          true    # ← FIX: was missing → defaulted false → fixed pose (0.0,0.7)
    default_start_x:         -1.28
    default_start_y:          0.70
    default_start_yaw_deg:   180.0
    case_detection_mode:     "fixed"
    fixed_case:              "right_only"   # ← was missing from my previous fix
    camera_metrics_timeout_s: 5.0    # ← my fix used 1.0; old used 5.0 (safer for detection lag)
    camera_x_scale:          -0.01
    camera_y_scale:           0.01
    camera_x_offset_m:        0.0
    camera_y_offset_m:        0.0

motion_executor:
  ros__parameters:
    plan_topic: "/autopark/plan_result_disabled"

vins_pose_bridge:
  ros__parameters:
    odom_topic:       "/vins_estimator/odometry"
    start_pose_topic: "/autopark/start_pose"
    x_offset:          0.0
    y_offset:          0.0
    yaw_offset_deg:    0.0
    publish_rate_hz:   10.0

# rear_cam_tracker removed — rear camera not used.
# Start pose: side_cam -> lot_detector -> perception_bridge -> /autopark/start_pose
# Depth/centering: ultrasonic only.
