autopark_master:
  ros__parameters:
    planner_mode: "both_sides"
    use_default_pose_when_missing: true
    default_start_x: -1.28    # was 0.00 → planner rejected (x must be ≤ -0.10)
    default_start_y: 0.70
    default_start_yaw_deg: 180.0
    disable_ultrasonic_block: true
    steer_wait_seconds: 4.0
    speed_scale: 0.12

    # ── Replan loop ───────────────────────────────────────────────────
    replan_interval_s: 1.0
    replan_max_attempts: 10

    # ── Ultrasonic post-park correction ──────────────────────────────
    us_center_enable: true

    # ── Lateral (left / right wall) centering ────────────────────────
    us_left_idx: 1
    us_right_idx: 2
    us_deadband_m: 0.060        # ignore errors smaller than 6 cm
    us_steer_gain: 150.0        # correction_steer = error_m × gain (deg/m)
    us_max_steer_deg: 15.0
    us_correction_dist_m: 0.12  # exit + re-enter distance per attempt
    us_max_attempts: 3

    # ── Depth (rear wall) correction ─────────────────────────────────
    us_rear_idx: 6
    us_rear_target_m: 0.20      # target = 20 cm from rear wall
    us_rear_tolerance_m: 0.06   # ±6 cm  →  window [14, 26] cm
    us_depth_max_step_m: 0.04   # max reverse per depth step (safety cap)
    us_depth_max_attempts: 4

    # ── Stop timing ───────────────────────────────────────────────────
    # us_stop_buffer_s is used for:
    #   • Time-based moves: stop this many seconds early (legacy)
    #   • Real-time US moves: lead time = buffer × speed
    #     At 0.06 m/s → lead = 0.20 × 0.06 = 1.2 cm
    #     Trigger fires at 20 + 1.2 = 21.2 cm so car coasts to ≈20 cm
    us_stop_buffer_s: 0.20
    us_stop_settle_s: 0.60      # wait after stop before reading sensors
    us_steer_wait_s: 2.0        # steer settle for correction moves only
    us_correction_speed_mps: 0.06

    # ── Real-time US monitoring ───────────────────────────────────────
    # Poll rate during active correction moves.
    # 50 Hz → check every 20 ms; at 0.06 m/s → 0.12 cm per tick.
    # Increase if sensor publishes faster; decrease if CPU is tight.
    us_monitor_hz: 50.0

serial_bridge:
  ros__parameters:
    drive_port: "/dev/ttyUSB0"
    us_front_port: ""
    us_rear_port: ""
    us_all_port: "/dev/ttyUSB2"
    baud: 115200

motion_executor:
  ros__parameters:
    plan_topic: "/autopark/plan_result_disabled"
    drive_topic: "/autopark/cmd_json"
    speed_scale: 0.035
    steer_scale: 0.5
    stop_between_segments: true

slot_detector:
  ros__parameters:
    use_mock_detection: true
